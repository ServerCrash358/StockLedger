services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockledger
      POSTGRES_PASSWORD: stockledger
      POSTGRES_MULTIPLE_DATABASES: stockledger,stockledger_test
    ports:
      - "5432:5432"
    volumes:
      - stockledger_pgdata:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockledger_pgdata:
